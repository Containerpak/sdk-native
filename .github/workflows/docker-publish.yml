name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-sdk-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/containerpak/sdk-native
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify SDK
        run: docker run --rm ghcr.io/containerpak/sdk-native:main sh -c 'gcc --version && clang --version && make --version && cmake --version && meson --version && ninja --version && autoconf --version && bison --version && flex --version && gdb --version && ld --version && objdump --version && dpkg-buildpackage --version && command -v dh && cups-config --version && cups-config --cflags --libs && printf "int main(void) { return 0; }\n" | gcc -m32 -x c - -o /tmp/native-sdk-32 && readelf -h /tmp/native-sdk-32 | grep "Class:.*ELF32"'
